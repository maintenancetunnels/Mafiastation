# Meta Station (Monolith port) compatibility stubs.
#
# Monolith's meta.yml places a handful of Monolith-specific loot/fixtures our Delta-V base
# doesn't define: custom-caliber ammo (their _Mono gun system), telecom holopads, an AI-upload
# nav beacon, and a contraband poster. Rather than drag in Monolith's whole cartridge/caliber
# tree, these minimal stubs let the map deserialize cleanly (uids resolve, no dangling container
# refs). They render as inert placeholders.
#
# FOLLOW-UP: for playability, replace the ammo stubs with real Delta-V ammo equivalents and the
# holopads with our holopad structure. Tracked as a post-render task; structural map is unaffected.

