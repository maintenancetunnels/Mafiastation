- type: job
  id: Prisoner
  name: job-name-prisoner
  description: job-description-prisoner
  playTimeTracker: JobPrisoner
  startingGear: PrisonerGear
  alwaysUseSpawner: true
  canBeAntag: false
#  whitelistRequired: true
  icon: "JobIconPrisoner"
  supervisors: job-supervisors-security
  setPreference: false # _ForkStation: persistent prisoners are force-assigned, not voluntarily chosen
  # _ForkStation: no playtime requirement — penalized players must always be assignable to this job.
  special:
  - !type:AddImplantSpecial
    implants: [ TrackingImplant ]
  - !type:AddComponentSpecial # _ForkStation: good behavior credit tracking
    components:
      - type: GoodBehavior

- type: startingGear
  id: PrisonerGear
  equipment:
    id: PrisonerPDA
    ears: ClothingHeadsetPrison

- type: chameleonOutfit
  id: PrisonerChameleonOutfit
  job: Prisoner
  equipment:
    id: PrisonerPDA
    ears: ClothingHeadsetPrison
    jumpsuit: ClothingUniformJumpsuitPrisoner
