# Mafiastation server configuration.
# Launch via run_server.ps1 so this file is picked up.

[movement]
# Native wizden mob collision: mobs softly push each other apart instead of
# phasing through each other. The component ships on BaseMob; this turns the
# system on (upstream default is false).
mob_pushing = true

[game]
# Lobby must be ON for defaultpreset to apply: with the lobby disabled the ticker
# hard-codes sandbox (GameTicker.GamePreset.cs). Production behavior = lobby on.
lobbyenabled = true
# The flagship round type: social-deduction paranoia with the horror event pool.
defaultpreset = "Mafiastation"
# Persistent Prisoner system (see docs/design/PersistentPrisoners.md).
persistent_prisoner = true
persistent_prisoner_decay = true
persistent_prisoner_decay_hours = 48.0

[events]
# Station events on (the dev build preset turns them off) — the horror pool
# (LiminalFlicker, BlackoutHunt) fires through the event scheduler.
enabled = true

[mafiastation]
# The station has a basement. Nobody built it. It was always there.
basement_enabled = true
basement_grid = "/Maps/Ruins/ruined_prison_ship.yml"
